<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>

<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
</helmet>

<a href="#main-content" style="position:absolute;left:-9999px;top:0;z-index:300;background:#C9F31D;color:#120E17;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:13px;padding:10px 18px;border-radius:0 0 8px 0;text-decoration:none;" style-focus="left:0;">Skip to content</a>
<div style="{{ containerStyle }}">
  <div style="{{ topRowStyle }}">
    <a href="Home.dc.html" style="display:flex;flex-direction:column;gap:4px;text-decoration:none;">
      <span style="display:flex;align-items:baseline;gap:1px;">
        <span style="font-family:'Dancing Script',cursive;font-weight:700;font-size:{{ gSize }};letter-spacing:0;line-height:0.7;color:#C9F31D;">G</span>
        <span style="font-family:'Space Grotesk',sans-serif;font-size:{{ nameSize }};font-weight:500;letter-spacing:0.01em;color:rgba(242,239,233,0.75);">bemi</span>
      </span>
      <sc-if value="{{ showFullMark }}" hint-placeholder-val="{{ true }}">
        <span style="display:flex;align-items:baseline;gap:4px;">
          <img src="assets/sigil-d-lime.png" alt="D" style="height:{{ sigilSize }};width:auto;">
          <span style="font-family:'Space Grotesk',sans-serif;font-size:{{ nameSize }};font-weight:500;letter-spacing:0.01em;color:rgba(242,239,233,0.75);">aniel</span>
        </span>
        <span style="font-family:'Space Mono',monospace;font-size:10px;letter-spacing:0.1em;color:rgba(201,243,29,0.55);margin-top:4px;">dee</span>
      </sc-if>
    </a>
    <sc-if value="{{ isMobile }}" hint-placeholder-val="{{ false }}">
      <span onClick="{{ toggleMenu }}" onKeyDown="{{ toggleMenuKeyDown }}" tabIndex="0" role="button" aria-expanded="{{ menuOpen }}" aria-controls="mobile-nav-menu" aria-label="Toggle navigation menu" style="cursor:pointer;padding:6px;flex-shrink:0;outline:none;" style-focus="opacity:0.7;">
        <sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M5 5L19 19M19 5L5 19" stroke="#F2EFE9" stroke-width="1.8" stroke-linecap="round"></path></svg>
        </sc-if>
        <sc-if value="{{ menuClosed }}" hint-placeholder-val="{{ true }}">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M4 6H20M4 12H20M4 18H20" stroke="#F2EFE9" stroke-width="1.8" stroke-linecap="round"></path></svg>
        </sc-if>
      </span>
    </sc-if>
  </div>

  <div id="mobile-nav-menu" style="{{ menuPanelStyle }}">
    <div style="display:flex;flex-direction:column;gap:10px;width:100%;">
      <a href="Home.dc.html" style="{{ homeLinkStyle }}" style-hover="color:#C9F31D;background:rgba(201,243,29,0.05);border-color:rgba(201,243,29,0.15);border-bottom-color:#C9F31D;">HOME</a>
      <a href="Work.dc.html" style="{{ workLinkStyle }}" style-hover="color:#C9F31D;background:rgba(201,243,29,0.05);border-color:rgba(201,243,29,0.15);border-bottom-color:#C9F31D;">WORK</a>
      <a href="About.dc.html" style="{{ aboutLinkStyle }}" style-hover="color:#C9F31D;background:rgba(201,243,29,0.05);border-color:rgba(201,243,29,0.15);border-bottom-color:#C9F31D;">ABOUT</a>
      <a href="Blog.dc.html" style="{{ writingLinkStyle }}" style-hover="color:#C9F31D;background:rgba(201,243,29,0.05);border-color:rgba(201,243,29,0.15);border-bottom-color:#C9F31D;">WRITING</a>
    </div>
    <div style="display:flex;flex-direction:column;gap:14px;align-items:flex-start;">
      <svg width="64" height="14" viewBox="0 0 64 14" fill="none">
        <path d="M0 7H10L14 2L18 12L22 4L26 10L30 7H64" stroke="rgba(242,239,233,0.3)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"></path>
      </svg>
      <div style="display:flex;gap:8px;">
        <dc-import name="SocialIcon" network="github" size="28" hint-size="28px,28px"></dc-import>
        <dc-import name="SocialIcon" network="x" size="28" hint-size="28px,28px"></dc-import>
        <dc-import name="SocialIcon" network="linkedin" size="28" hint-size="28px,28px"></dc-import>
      </div>
      <a href="assets/resume.pdf" download style="font-family:'Space Mono',monospace;font-size:10px;letter-spacing:0.08em;color:rgba(201,243,29,0.7);text-decoration:none;display:flex;align-items:center;gap:5px;" style-hover="color:#C9F31D;text-decoration:underline;">RÉSUMÉ ↓</a>
    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { isMobile: false, menuOpen: false };
  componentDidMount() {
    this.check();
    window.addEventListener('resize', this.check);
  }
  componentWillUnmount() {
    window.removeEventListener('resize', this.check);
  }
  check = () => {
    const isMobile = window.innerWidth < 700;
    if (isMobile !== this.state.isMobile) this.setState({ isMobile, menuOpen: isMobile ? this.state.menuOpen : false });
  };
  linkStyle(active) {
    const base = "display:block;width:calc(100% + 24px);box-sizing:border-box;padding:10px 20px 10px 12px;border-radius:8px 0 0 8px;border:1px solid transparent;border-right:none;border-bottom:1.5px solid transparent;font-size:12px;letter-spacing:0.08em;text-decoration:none;transition:color 0.2s cubic-bezier(0.16,1,0.3,1),background 0.2s cubic-bezier(0.16,1,0.3,1),border-color 0.2s cubic-bezier(0.16,1,0.3,1);";
    return active
      ? base + "color:#C9F31D;background:rgba(201,243,29,0.05);border-color:rgba(201,243,29,0.15);border-bottom-color:#C9F31D;"
      : base + "color:rgba(242,239,233,0.55);";
  }
  renderVals() {
    const m = this.state.isMobile;
    const open = this.state.menuOpen;
    const path = window.location.pathname.split('/').pop() || 'Home.dc.html';
    return {
      homeLinkStyle: this.linkStyle(path === 'Home.dc.html' || path === ''),
      workLinkStyle: this.linkStyle(path === 'Work.dc.html' || path === 'Client-Work.dc.html' || path === 'Concepts.dc.html' || path === 'Case-Study.dc.html'),
      aboutLinkStyle: this.linkStyle(path === 'About.dc.html'),
      writingLinkStyle: this.linkStyle(path === 'Blog.dc.html' || path === 'Article.dc.html'),
      isMobile: m,
      menuOpen: open,
      menuClosed: !open,
      showFullMark: !m,
      gSize: m ? '26px' : '38px',
      nameSize: m ? '14px' : '17px',
      sigilSize: m ? '22px' : '30px',
      toggleMenu: () => this.setState({ menuOpen: !this.state.menuOpen }),
      toggleMenuKeyDown: (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); this.setState({ menuOpen: !this.state.menuOpen }); } },
      containerStyle: m
        ? "width:100%;position:fixed;top:0;left:0;right:0;z-index:200;display:flex;flex-direction:column;align-items:stretch;padding:0;box-sizing:border-box;font-family:'Space Grotesk',sans-serif;background:#120E17;border-bottom:1px solid rgba(201,243,29,0.12);"
        : "width:140px;flex-shrink:0;border-right:1px solid rgba(201,243,29,0.12);display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;padding:28px 24px;position:sticky;top:0;align-self:flex-start;height:100vh;box-sizing:border-box;font-family:'Space Grotesk',sans-serif;",
      topRowStyle: m
        ? "width:100%;display:flex;align-items:center;justify-content:space-between;padding:12px 20px;box-sizing:border-box;"
        : "display:contents;",
      menuPanelStyle: m
        ? (open
            ? "display:flex;flex-direction:column;gap:24px;padding:20px;background:#120E17;border-top:1px solid rgba(201,243,29,0.12);position:fixed;top:56px;left:0;right:0;max-height:calc(100vh - 56px);overflow-y:auto;z-index:199;box-sizing:border-box;"
            : "display:none;")
        : "display:contents;",
    };
  }
}

</script>
</body>
</html>
