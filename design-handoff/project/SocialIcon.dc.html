<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>

<a href="{{ href }}" target="_blank" rel="noopener noreferrer" style="width:{{ sizePx }};height:{{ sizePx }};min-width:{{ sizePx }};border-radius:50%;border:1px solid rgba(242,239,233,0.18);color:rgba(242,239,233,0.6);display:inline-flex;align-items:center;justify-content:center;text-decoration:none;box-sizing:border-box;transition:border-color 0.25s cubic-bezier(0.16,1,0.3,1),background 0.25s cubic-bezier(0.16,1,0.3,1),color 0.25s cubic-bezier(0.16,1,0.3,1),transform 0.25s cubic-bezier(0.16,1,0.3,1);" style-hover="border-color:#C9F31D;background:rgba(201,243,29,0.08);color:#C9F31D;transform:translateY(-2px);">
  <sc-if value="{{ isX }}" hint-placeholder-val="{{ true }}">
    <svg width="{{ iconSize }}" height="{{ iconSize }}" viewBox="0 0 24 24" fill="none">
      <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z" fill="currentColor"></path>
    </svg>
  </sc-if>
  <sc-if value="{{ isLinkedin }}" hint-placeholder-val="{{ false }}">
    <svg width="{{ iconSize }}" height="{{ iconSize }}" viewBox="0 0 24 24" fill="none">
      <rect x="2" y="9" width="4" height="12" fill="currentColor"></rect>
      <circle cx="4" cy="4" r="2" fill="currentColor"></circle>
      <path d="M10 9h4v2.1c.9-1.4 2.4-2.4 4.3-2.4 3.7 0 4.7 2.4 4.7 5.6V21h-4v-6c0-1.4 0-3.2-2-3.2s-2.3 1.6-2.3 3.1V21h-4V9z" fill="currentColor"></path>
    </svg>
  </sc-if>
  <sc-if value="{{ isBehance }}" hint-placeholder-val="{{ false }}">
    <span style="font-family:'Space Mono',monospace;font-weight:700;font-size:{{ iconPx }};letter-spacing:-0.02em;line-height:1;">Be</span>
  </sc-if>
  <sc-if value="{{ isGithub }}" hint-placeholder-val="{{ false }}">
    <svg width="{{ iconSize }}" height="{{ iconSize }}" viewBox="0 0 24 24" fill="none">
      <path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path>
    </svg>
  </sc-if>
</a>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:140,&quot;height&quot;:60},&quot;network&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;x&quot;,&quot;options&quot;:[&quot;x&quot;,&quot;linkedin&quot;,&quot;behance&quot;,&quot;github&quot;],&quot;tsType&quot;:&quot;string&quot;},&quot;href&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;#&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:36,&quot;min&quot;:24,&quot;max&quot;:56,&quot;tsType&quot;:&quot;number&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const net = this.props.network ?? 'x';
    const size = this.props.size ?? 36;
    const defaults = {
      x: 'https://x.com/adamsdaniel043',
      linkedin: 'https://www.linkedin.com/in/gbemi-daniel',
      github: 'https://github.com/GbemiDaniel',
      behance: '#',
    };
    return {
      href: this.props.href ?? defaults[net] ?? '#',
      sizePx: size + 'px',
      iconSize: Math.round(size * 0.42),
      iconPx: Math.round(size * 0.42) + 'px',
      isX: net === 'x',
      isLinkedin: net === 'linkedin',
      isBehance: net === 'behance',
      isGithub: net === 'github',
    };
  }
}
</script>
</body>
</html>
