<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="assets/sigil-d-lime.png">
<script src="./support.js"></script>
</head>
<body>
<x-dc>

<helmet>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
  <style>
    body{margin:0;background:#120E17;}
    @keyframes ldOrbitSpin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
    @keyframes ldBlink{0%,50%{opacity:1;}51%,100%{opacity:0;}}
    @keyframes ldLineIn{from{opacity:0;transform:translateX(-4px);}to{opacity:1;transform:translateX(0);}}
  </style>
</helmet>

<div style="min-height:100vh;background:radial-gradient(1400px 900px at 15% -10%, #1C1522 0%, #120E17 55%);color:#F2EFE9;font-family:'Space Grotesk',sans-serif;display:flex;align-items:center;justify-content:center;opacity:{{ pageOpacity }};transition:opacity 0.5s cubic-bezier(0.16,1,0.3,1);">
  <div style="position:relative;padding:44px 52px;min-width:280px;">
    <span style="position:absolute;top:0;left:0;width:22px;height:22px;border-top:2px solid #C9F31D;border-left:2px solid #C9F31D;"></span>
    <span style="position:absolute;top:0;right:0;width:22px;height:22px;border-top:2px solid #C9F31D;border-right:2px solid #C9F31D;"></span>
    <span style="position:absolute;bottom:0;left:0;width:22px;height:22px;border-bottom:2px solid #C9F31D;border-left:2px solid #C9F31D;"></span>
    <span style="position:absolute;bottom:0;right:0;width:22px;height:22px;border-bottom:2px solid #C9F31D;border-right:2px solid #C9F31D;"></span>

    <div style="display:flex;align-items:baseline;gap:2px;margin-bottom:28px;">
      <span style="font-family:'Dancing Script',cursive;font-weight:700;font-size:30px;color:#C9F31D;">G</span>
      <span style="font-size:15px;font-weight:500;color:rgba(242,239,233,0.75);">bemi</span>
      <img src="assets/sigil-d-lime.png" alt="D" style="height:24px;width:auto;margin-left:5px;">
      <span style="font-size:15px;font-weight:500;color:rgba(242,239,233,0.75);">aniel</span>
    </div>

    <div style="display:flex;align-items:center;gap:12px;margin-bottom:22px;">
      <div style="position:relative;width:24px;height:24px;flex-shrink:0;">
        <div style="position:absolute;inset:0;animation:ldOrbitSpin 1.1s linear infinite;">
          <span style="position:absolute;top:0;left:50%;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:#C9F31D;box-shadow:0 0 7px 1px rgba(201,243,29,0.6);"></span>
        </div>
        <span style="position:absolute;top:50%;left:50%;width:7px;height:7px;margin:-3.5px 0 0 -3.5px;border-radius:50%;background:rgba(242,239,233,0.5);"></span>
      </div>
      <span style="font-family:'Space Mono',monospace;font-size:12px;color:rgba(242,239,233,0.55);">booting <span style="color:#C9F31D;">gbemidaniel.dev</span><span style="animation:ldBlink 1s step-end infinite;">_</span></span>
    </div>

    <div style="display:flex;flex-direction:column;gap:9px;margin-bottom:24px;">
      <sc-for list="{{ lines }}" as="line" hint-placeholder-count="3">
        <div style="font-family:'Space Mono',monospace;font-size:11px;letter-spacing:0.02em;color:{{ line.color }};animation:ldLineIn 0.3s ease both;display:flex;gap:8px;">
          <span style="color:#C9F31D;width:14px;flex-shrink:0;">{{ line.mark }}</span>{{ line.text }}
        </div>
      </sc-for>
    </div>

    <div style="display:flex;align-items:center;gap:12px;">
      <div style="flex:1;height:3px;background:rgba(255,255,255,0.1);border-radius:2px;overflow:hidden;">
        <div style="height:100%;background:#C9F31D;border-radius:2px;width:{{ progress }}%;transition:width 0.1s linear;"></div>
      </div>
      <span style="font-family:'Space Mono',monospace;font-size:11px;color:rgba(242,239,233,0.4);width:32px;text-align:right;">{{ progressLabel }}</span>
    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
const STAGES = [
  { text: 'loading assets', at: 30 },
  { text: 'mounting components', at: 65 },
  { text: 'ready', at: 100 },
];

class Component extends DCLogic {
  state = { progress: 0, fading: false };
  componentDidMount() {
    this.start = Date.now();
    this.tick();
  }
  componentWillUnmount() {
    if (this.timer) clearTimeout(this.timer);
  }
  tick = () => {
    const elapsed = Date.now() - this.start;
    const pct = Math.min(100, Math.round((elapsed / 1600) * 100));
    this.setState({ progress: pct });
    if (pct >= 100) {
      this.timer = setTimeout(() => {
        this.setState({ fading: true });
        this.timer = setTimeout(() => { window.location.href = 'Home.dc.html'; }, 480);
      }, 300);
      return;
    }
    this.timer = setTimeout(this.tick, 40);
  };
  renderVals() {
    const pct = this.state.progress;
    return {
      progress: pct,
      progressLabel: pct + '%',
      pageOpacity: this.state.fading ? 0 : 1,
      lines: STAGES.map((s) => ({
        text: s.text,
        mark: pct >= s.at ? '✓' : '·',
        color: pct >= s.at ? 'rgba(242,239,233,0.7)' : 'rgba(242,239,233,0.25)',
      })),
    };
  }
}

</script>
</body>
</html>
