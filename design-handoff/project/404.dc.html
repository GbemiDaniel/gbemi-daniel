    body{margin:0;background:#120E17;}

    @keyframes blink{0%,50%{opacity:1;}51%,100%{opacity:0;}}

    <div style="text-align:center;max-width:480px;">
      <div style="font-family:'Space Mono',monospace;font-size:13px;color:rgba(201,243,29,0.6);margin-bottom:20px;">$ cd /this-page<span style="animation:blink 1s step-end infinite;">_</span></div>
      <div style="font-family:'Space Grotesk',sans-serif;font-size:clamp(64px,12vw,120px);font-weight:700;line-height:1;color:rgba(242,239,233,0.08);margin-bottom:4px;">404</div>
      <h1 style="font-size:clamp(22px,3vw,30px);font-weight:600;margin:0 0 14px;">This route doesn't exist.</h1>

      <a href="Home.dc.html" style="display:inline-flex;align-items:center;gap:10px;background:#C9F31D;color:#120E17;font-weight:700;font-size:14px;padding:14px 28px;border-radius:100px;text-decoration:none;" style-hover="background:#F2EFE9;">← Back to Home</a>
    </div>
  </div>
</div>
